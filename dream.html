<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 꿈</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&amp;display=swap" rel="stylesheet">
    <style>
        /* 기본 변수 및 리셋 */
        :root {
            --bg-dark: #070b19;
            --bg-deep-teal: #0a2236;
            --accent-gold: #ffd700;
            --accent-cyan: #70e4ef;
            --text-light: #f0f8ff;
            --card-front: rgba(255, 255, 255, 0.08);
            --card-back: rgba(10, 34, 54, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nanum Gothic', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(to bottom, var(--bg-dark) 0%, var(--bg-deep-teal) 70%, #05131e 100%);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 60px;
        }

        /* 캔버스 배경 (별빛, 호수, 마우스 반짝이) */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* 메인 레이아웃 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 760px;
            margin: 0 auto;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        /* 헤더 & 통통 튀는 별명 애니메이션 */
        header {
            text-align: center;
            padding-top: 25px;
        }

        .header-sub {
            font-size: 1.05rem;
            color: var(--accent-cyan);
            letter-spacing: 2px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .nickname-wrap {
            display: inline-block;
            margin: 10px 0 15px 0;
        }

        .nickname {
            display: inline-block;
            font-size: 4.5rem;
            font-weight: 800;
            color: var(--accent-gold);
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 35px rgba(255, 215, 0, 0.4);
            animation: bounce 1.6s infinite ease-in-out;
            cursor: pointer;
            user-select: none;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0) scale(1, 1);
            }
            30% {
                transform: translateY(-30px) scale(1.08, 0.95) rotate(-2deg);
            }
            50% {
                transform: translateY(0) scale(0.95, 1.05);
            }
            65% {
                transform: translateY(-12px) scale(1.02, 0.98);
            }
            80% {
                transform: translateY(0) scale(1, 1);
            }
        }

        /* 모듈형 카드 디자인 */
        .card-box {
            background: rgba(12, 28, 48, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(112, 228, 239, 0.22);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .section-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 18px;
            text-align: center;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(112, 228, 239, 0.4);
        }

        /* 1. 방문자 환영 인사 */
        .welcome-section {
            text-align: center;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .input-group input {
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid var(--accent-cyan);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            width: 210px;
            text-align: center;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 12px var(--accent-cyan);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: white;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.35);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 180, 219, 0.55);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .welcome-message {
            margin-top: 16px;
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--accent-gold);
            min-height: 28px;
            word-break: keep-all;
        }

        /* 2. 좋아하는 것 3가지 (플립 카드) */
        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            perspective: 1000px;
        }

        .flip-card {
            background-color: transparent;
            height: 220px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .flip-card-front {
            background: var(--card-front);
            backdrop-filter: blur(6px);
        }

        .flip-card-front .icon {
            font-size: 3.6rem;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        .flip-card-front .card-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffffff;
        }

        .flip-card-front .hint {
            font-size: 0.78rem;
            color: var(--accent-cyan);
            margin-top: 10px;
            opacity: 0.8;
        }

        .flip-card-back {
            background: var(--card-back);
            transform: rotateY(180deg);
            border: 1px solid var(--accent-cyan);
            box-shadow: inset 0 0 15px rgba(112, 228, 239, 0.2);
        }

        .flip-card-back p {
            font-size: 0.92rem;
            line-height: 1.55;
            color: #e0f7fa;
            word-break: keep-all;
        }

        /* 3. OX 퀴즈 */
        .quiz-section {
            text-align: center;
        }

        .quiz-question {
            font-size: 1.2rem;
            margin-bottom: 22px;
            color: #ffffff;
            line-height: 1.4;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
        }

        .quiz-btns {
            display: flex;
            justify-content: center;
            gap: 25px;
        }

        .ox-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            font-size: 2.2rem;
            font-weight: 800;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .btn-o {
            background: rgba(46, 204, 113, 0.18);
            color: #2ecc71;
            border-color: #2ecc71;
        }

        .btn-x {
            background: rgba(231, 76, 60, 0.18);
            color: #e74c3c;
            border-color: #e74c3c;
        }

        .ox-btn:hover {
            transform: scale(1.12);
        }

        .quiz-result {
            margin-top: 20px;
            font-size: 1.05rem;
            font-weight: bold;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 10px 15px;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(10px);
        }

        .quiz-result.show {
            opacity: 1;
            transform: translateY(0);
        }

        .quiz-result.correct {
            background: rgba(46, 204, 113, 0.22);
            color: #a3e635;
            border: 1px solid #2ecc71;
        }

        .quiz-result.wrong {
            background: rgba(231, 76, 60, 0.22);
            color: #ff8b8b;
            border: 1px solid #e74c3c;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* 4. 음악 추천 섹션 */
        .music-section {
            text-align: center;
        }

        .music-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px 15px;
            margin-top: 15px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px dashed rgba(112, 228, 239, 0.4);
            transition: all 0.3s ease;
        }

        .song-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin-bottom: 6px;
            word-break: keep-all;
        }

        .song-artist {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .song-desc {
            font-size: 0.82rem;
            color: var(--accent-cyan);
            margin-top: 8px;
            font-style: italic;
        }

        /* 폭죽 축하 효과 요소 */
        .confetti {
            position: fixed;
            width: 9px;
            height: 9px;
            z-index: 99;
            pointer-events: none;
            border-radius: 50%;
        }

        /* 모바일 최적화 레이아웃 */
        @media (max-width: 600px) {
            .nickname {
                font-size: 3.6rem;
            }
            .section-title {
                font-size: 1.2rem;
            }
            .favorites-grid {
                grid-template-columns: 1fr;
            }
            .flip-card {
                height: 190px;
            }
            .input-group input {
                width: 100%;
            }
            .btn {
                width: 100%;
            }
            .container {
                gap: 25px;
            }
        }
    </style>
